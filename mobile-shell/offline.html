<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#123b28" />
    <title>Municipio Digital · Sin conexión</title>
    <style>
      :root { color-scheme: light; font-family: "Segoe UI", Arial, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 28px; color: #123b28; background: linear-gradient(145deg, #eff7e8, #fff 55%, #f8efbf); }
      main { width: min(100%, 430px); padding: 38px 28px; text-align: center; background: rgba(255, 255, 255, .94); border: 1px solid #dce8d9; border-radius: 28px; box-shadow: 0 24px 60px rgba(18, 59, 40, .14); }
      img { display: block; width: min(100%, 280px); height: auto; margin: 0 auto 26px; }
      span { display: grid; place-items: center; width: 58px; height: 58px; margin: 0 auto 18px; border-radius: 18px; color: white; font-size: 28px; background: #1d6a43; }
      h1 { margin: 0 0 12px; font-size: 28px; }
      p { margin: 0; color: #577063; line-height: 1.6; }
      button { width: 100%; margin-top: 24px; padding: 14px 18px; border: 0; border-radius: 14px; color: white; font: inherit; font-weight: 700; background: #1d6a43; }
    </style>
  </head>
  <body>
    <main>
      <img src="marca-cuatro-canadas.png" alt="Gobierno Autónomo Municipal de Cuatro Cañadas" />
      <span aria-hidden="true">↻</span>
      <h1>Sin conexión</h1>
      <p>Municipio Digital necesita acceso a internet para consultar información y mantener tus datos actualizados.</p>
      <button type="button" onclick="location.reload()">Volver a intentar</button>
    </main>
  </body>
</html>
